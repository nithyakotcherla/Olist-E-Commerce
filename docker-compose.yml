services:
  # 1. Production OLTP Database (Postgres)
  postgres-oltp:
    image: postgres:13
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: olist_production
    ports:
      - "5433:5432"
    volumes:
      - ./raw_data:/raw_data           # Map local CSVs for initial loading
      - postgres_oltp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d olist_production"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Analytics Data Warehouse (Postgres simulating Redshift)
  postgres-dw:
    image: postgres:13
    environment:
      POSTGRES_USER: dw_admin
      POSTGRES_PASSWORD: dw_password
      POSTGRES_DB: analytics_warehouse
    ports:
      - "5434:5432"
    volumes:
      - postgres_dw_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dw_admin -d analytics_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. MinIO (Simulating Amazon S3)
  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Console/UI Port
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Airflow metadata database
  postgres-airflow:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
       test: ["CMD-SHELL", "pg_isready -U airflow"]
       interval: 5s
       timeout: 5s
       retries: 5

  # 5. Apache Airflow (Standalone for easy local dev)
  airflow:
    image: apache/airflow:2.7.1-python3.10
    depends_on:
       postgres-airflow:
         condition: service_healthy
       postgres-oltp:
         condition: service_started
       postgres-dw:
         condition: service_started
       minio:
         condition: service_started
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      # Connections for our databases
      - AIRFLOW_CONN_OLTP_DB=postgresql://admin:admin_password@postgres-oltp:5432/olist_production
      - AIRFLOW_CONN_DW_DB=postgresql://dw_admin:dw_password@postgres-dw:5432/analytics_warehouse
      # dbt targets the DW over the Docker network, not the host's published port
      - DBT_HOST=postgres-dw
      - DBT_PORT=5432
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt_ecommerce:/opt/airflow/dbt_ecommerce
      - ./requirements.txt:/requirements.txt
    command: >
      bash -c "pip install -r /requirements.txt;
      if [ ! -x /opt/airflow/dbt_venv/bin/dbt ]; then
        python -m venv /opt/airflow/dbt_venv &&
        /opt/airflow/dbt_venv/bin/pip install --quiet --no-cache-dir 'dbt-core~=1.10.0' 'dbt-postgres==1.10.0' || echo 'WARN: dbt install failed';
      fi;
      airflow db migrate &&
      (airflow users create --username airflow --password airflow --firstname Air --lastname Flow --role Admin --email admin@example.com || true) &&
      airflow standalone"

  # 6. Metabase
  metabase:
    image: metabase/metabase:latest
    container_name: metabase_bi
    environment:
      # Docker Desktop here has ~3.8GB total; an uncapped JVM gets OOM-killed
      # (exit 137) the moment the DAG's load tasks spike memory.
      JAVA_OPTS: "-Xmx768m -Xss512k"
      MB_DB_FILE: /metabase.db/metabase.db
    mem_limit: 2g
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase.db

volumes:
  postgres_oltp_data:
  postgres_dw_data:
  postgres_airflow_data:
  metabase_data:
